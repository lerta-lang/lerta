<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <g transform="translate(80 64) scale(1.375)">
    <rect width="64" height="64" rx="14" fill="#0b6bcb"/>
    <path d="M21 16V46H45" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 30H45" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="194" y="134" font-size="76" font-weight="700" fill="#e6edf3">Lerta</text>
    <text x="80" y="216" font-size="31" fill="#9198a1">A statically typed language that compiles to native code,</text>
    <text x="80" y="258" font-size="31" fill="#9198a1">with CoffeeScript-like syntax and TypeScript-like type inference.</text>
  </g>
  <rect x="80" y="300" width="1040" height="274" rx="12" fill="#161b22" stroke="#3d444d"/>
  <g font-family="Menlo, Consolas, monospace" font-size="21" fill="#e6edf3" xml:space="preserve">
    <text x="112" y="346">text := <tspan fill="#7ee787">'the quick fox and the lazy dog and the end'</tspan></text>
    <text x="112" y="406">counts: <tspan fill="#d2a8ff">Map</tspan>&lt;<tspan fill="#d2a8ff">String</tspan>, <tspan fill="#d2a8ff">Int</tspan>&gt;</text>
    <text x="112" y="436"><tspan fill="#ff7b9c">for</tspan> word in text.split(<tspan fill="#7ee787">' '</tspan>)</text>
    <text x="137.3" y="466">counts[word, default: <tspan fill="#ffa657">0</tspan>] += <tspan fill="#ffa657">1</tspan></text>
    <text x="112" y="526"><tspan fill="#ff7b9c">for</tspan> (word, count) in counts.to_array().sorted_by(((_, n)) -&gt; -n)</text>
    <text x="137.3" y="556">print <tspan fill="#7ee787">"#{word.pad_end(6)} #{'*'.repeat(count)}"</tspan></text>
  </g>
</svg>
