# The check of the style, and the tests of each target on a runner of its system (see
# CONTRIBUTING.md#continuous-integration); for a tag of a version, the release too (see
# CONTRIBUTING.md#releases).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run; each commit of main, and each tag, keeps its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

env:
  # llvm-mingw, as tools/docker/wine/Dockerfile has it, with the checksum that its release gives
  # of the archive of each architecture.
  LLVM_MINGW_VERSION: '20261006'
  LLVM_MINGW_SHA256_x86_64: 317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a
  LLVM_MINGW_SHA256_aarch64: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2

jobs:
  # The style is the same on every system, so one job checks it.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # First, so that the run of a tag of the wrong version shows its failure at once, though the
      # tests go on.
      - name: Check the tag against VERSION
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
      - run: make check

  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A 32-bit target runs on the runner of its 64-bit one, which runs its programs as they
        # are.
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-i386
            runner: ubuntu-24.04
            packages: gcc-multilib
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
            # Of the two macOS targets, which it holds both of, tested as they are.
            also_released: macos-universal
          - target: macos-amd64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-2025
            llvm_mingw: x86_64
          - target: windows-i386
            runner: windows-2025
            llvm_mingw: x86_64
          - target: windows-arm64
            runner: windows-11-arm
            llvm_mingw: aarch64
    defaults:
      run:
        # Git Bash on Windows, which the build needs there.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ${{ matrix.packages }}

      # Windows scans each program that runs for the first time, as the tests' all do.
      - name: Turn off the scanning of new programs
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install make and llvm-mingw
        if: runner.os == 'Windows'
        run: |
          choco install make --no-progress -y
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-${{ matrix.llvm_mingw }}"
          curl -sSfL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip"
          sha256="${{ env[format('LLVM_MINGW_SHA256_{0}', matrix.llvm_mingw)] }}"
          echo "$sha256  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      # The runner's own temporary directory has a short name, RUNNER~1, in its path, and may be on
      # another drive than the tree, which the tests of serve_files and lerta lsp do not expect (see
      # docs/issues.md).
      - name: Move the temporary directory
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Test
        run: make test-target TARGET=${{ matrix.target }}

      - name: Package
        if: github.ref_type == 'tag'
        run: tools/package.sh ${{ matrix.target }} ${{ matrix.also_released }}

      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: build/release/*

  # A draft, which is published once its notes are written by hand.
  release:
    if: github.ref_type == 'tag'
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Lerta ${GITHUB_REF_NAME#v}"
